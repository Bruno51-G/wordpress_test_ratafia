<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Bouteilles - Page accueil - La Vignerie</title>
    <link rel="stylesheet" href="./assets/CSS/slider.css">
    <link rel="stylesheet" href="./assets/CSS/accessibilite.css">
    <script type="text/javascript" src="./assets/JS/script.js" defer></script>
</head>
<body>

    <!-- Barre d'accessibilité -->
<div class="barre_accessibilite">
        <button class="bouton_theme" id="bouton_clair" aria-label="Mode clair">
            <img src="./img/mode_clair.png" alt="Mode clair">
        </button>

        <button class="bouton_theme" id="bouton_sombre" aria-label="Mode sombre">
            <img src="./img/mode_sombre.png" alt="Mode sombre">
        </button>

        <button class="bouton_theme" id="bouton_dyslexie" aria-label="Police dyslexie">
            Aa
        </button>
</div>

    <!-- Titre et Sous titre -->
    <div class="titre_slide">
        <h2>LES ÉLIXIRS DE CAMILLE</h2>
        <h3>> LES RATAFIAS CHAMPENOIS IG</h3>
    </div>

    <!-- Liens à droite -->
<div class="liens_droite">
    <a href="#">> LES RATAFIA IG</a>
    <a href="#">> LE RATAFOU</a>
</div>

    <!-- Conteneur principal du slider -->
    <div class="slider_complet">

        <!-- Fonds -->
        <div class="fonds_piste">

            <!-- Fond 1 : affiché par défaut -->
            <div class="fond actif">
                <img src="./img/DECOR1.png" alt="Fond du slide n°1">
            </div>

            <!-- Fond 2 -->
            <div class="fond">
                <img src="./img/DECOR2.png" alt="Fond du slide n°2">
            </div>

            <!-- Fond 3 -->
            <div class="fond">
                <img src="./img/DECOR3.png" alt="Fond du slide n°3">
            </div>

            <!-- Fond 4 -->
            <div class="fond">
                <img src="./img/DECOR4.png" alt="Fond du slide n°4">
            </div>

        </div>

        <!-- Bouteilles : carrousel avec 3 visibles simultanément -->
        <div class="bouteilles_piste">

            <!-- Bouteille 1 : active par défaut -->
            <div class="bouteille actif">
                <img src="./img/bouteille1.png" alt="Bouteille n°1">
            </div>

            <!-- Bouteille 2 -->
            <div class="bouteille suivant">
                <img src="./img/bouteille2.png" alt="Bouteille n°2">
            </div>

            <!-- Bouteille 3 -->
            <div class="bouteille">
                <img src="./img/bouteille3.png" alt="Bouteille n°3">
            </div>

            <!-- Bouteille 4 -->
            <div class="bouteille precedent">
                <img src="./img/bouteille4.png" alt="Bouteille n°4">
            </div>

        </div>

        <!-- Navigation du slider -->
        <div class="slide_navigation">

            <!-- Bouton slide précédent -->
            <button class="bouton_navigation" id="bouton_precedent">
                <img src="./img/direction_gauche.png" alt="Bouton précédent">
            </button>

            <!-- Bouton de validation pour voir la cuvée -->
            <span class="decouverte_cuvee"><a href="https://www.youtube.com/watch?v=5bCVk1bc_oQ&t=3s" target="_blank">DÉCOUVRIR LA CUVÉE</a></span>

            <!-- Bouton slide suivant -->
            <button class="bouton_navigation" id="bouton_suivant">
                <img src="./img/direction_droite.png" alt="Bouton suivant">
            </button>

        </div>

    </div>

</body>
</html>
