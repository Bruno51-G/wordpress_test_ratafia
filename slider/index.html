<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Bouteilles - Page accueil - La Vignerie</title>
    <link rel="stylesheet" href="./assets/CSS/slider.css">
</head>
<body>
    <!-- Conteneur principal du slider -->
    <div class="slider_complet">

        <!-- piste où défile le slider -->
        <div class="slide_piste">
        
        <!-- Slide 1 : affiché par défault au chargement de la page -->
        <div class="slide_active">
            <img class="slide_decor" src="./img/DECOR_1.png" alt="Fond du slide n°1">
            <img class="slide_bouteille" src="./img/bouteille1.png" alt="Bouteille n°1">
        </div>

        <!-- Slide 2 -->
        <div class="slide">
            <img class="slide_decor" src="./img/DECOR2.png" alt="Fond du slide n°2">
            <img class="slide_bouteille" src="./img/bouteille2.png" alt="Bouteille n°2">
        </div>

        <!-- Slide 3 -->
        <div class="slide">
            <img class="slide_decor" src="./img/DECOR3.png" alt="Fond du slide n°3">
            <img class="slide_bouteille" src="./img/bouteille3.png" alt="Bouteille n°3">
        </div>

        <!-- Navigation du slider (flèche gauche / droite + bouton de validation) -->
        <div class="slide_navigation">
            <!-- Bouton slide précédent -->
            <button class="bouton_navigation" id="bouton_precedent"><img src="./img/direction_gauche.png" alt="Bouton précédent"></button>
            
            <!-- Bouton de validation pour voir la cuvée de ratafia -->
            <span class="decouverte_cuvee">DÉCOUVRIR LA CUVÉE</span>

            <!-- Bouton slide suivant -->
            <button class="bouton_navigation" id="bouton_suivant"><img src="./img/direction_droite.png" alt="Bouton suivant"></button>
        </div>
        </div>

    </div>
</body>
</html>
